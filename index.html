<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOLD AI</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:25px;color:#e5bd55;font-size:30px;font-weight:bold;letter-spacing:3px}
.subtitle{text-align:center;color:#888;font-size:12px;margin-top:-15px}
.container{max-width:650px;margin:auto;padding:15px}
.card{background:#141a25;border:1px solid #303747;border-radius:15px;padding:20px;margin-bottom:18px}
h2{text-align:center;color:#e5bd55;font-size:19px}
label{display:block;color:#aaa;margin:15px 0 7px}
select,button{width:100%;padding:13px;border-radius:8px;border:1px solid #303747;background:#202938;color:white;font-size:15px}
button{background:#d5ad42;color:#080808;font-weight:bold;border:0;margin-top:20px;cursor:pointer}
.chart-box{width:100%;height:270px;margin-top:15px}
canvas{width:100%;height:100%;display:block}
.chart-note{font-size:11px;color:#888;text-align:center}
.signal{text-align:center;padding:20px;border-radius:12px;margin-top:15px;background:#101722}
.signal-icon{font-size:55px}
.buy{color:#21d889}
.sell{color:#ff5151}
.neutral{color:#e5bd55}
.signal-title{font-size:28px;font-weight:bold;margin:8px}
.info{font-size:12px;color:#888}
.footer{text-align:center;color:#666;font-size:11px;padding:20px}
</style>
</head>

<body>

<header>GOLD AI</header>
<p class="subtitle">SMART MARKET ANALYSIS</p>

<div class="container">

<div class="card">
<h2>MARKET CHART</h2>

<label>Actif :</label>
<select id="asset">
<option>XAUUSD</option>
<option>EUR/USD</option>
<option>GBP/USD</option>
<option>BTC/USD</option>
<option>ETH/USD</option>
</select>

<label>Timeframe :</label>
<select id="timeframe">
<option>M1</option>
<option>M5</option>
<option>M15</option>
<option>H1</option>
</select>

<div class="chart-box">
<canvas id="chart"></canvas>
</div>

<p class="chart-note">
Graphique de démonstration : bougies simulées, pas de prix réels.
</p>

<button onclick="drawChart()">ACTUALISER LE GRAPHIQUE</button>
</div>

<div class="card">
<h2>TRADING SIGNALS</h2>

<label>Mode :</label>
<select id="mode">
<option>Avec SL / TP</option>
<option>Sans SL / TP</option>
</select>

<button onclick="analyze()">ANALYSER LE MARCHÉ</button>

<div id="result" class="signal">
<div class="signal-icon neutral">◆</div>
<div class="signal-title neutral">EN ATTENTE</div>
<p>Aucune analyse disponible.</p>
<p class="info">Connexion aux données de marché nécessaire.</p>
</div>
</div>

</div>

<div class="footer">
GOLD AI © 2026 — Version démonstration
</div>

<script>
function drawChart(){
const canvas=document.getElementById("chart");
const box=canvas.parentElement;
const width=box.clientWidth;
const height=box.clientHeight;
const ratio=window.devicePixelRatio||1;

canvas.width=width*ratio;
canvas.height=height*ratio;

const ctx=canvas.getContext("2d");
ctx.scale(ratio,ratio);
ctx.clearRect(0,0,width,height);

ctx.strokeStyle="#283243";
ctx.lineWidth=1;

for(let i=1;i<5;i++){
let y=height*i/5;
ctx.beginPath();
ctx.moveTo(0,y);
ctx.lineTo(width,y);
ctx.stroke();
}

let candles=[];
let price=150;
for(let i=0;i<35;i++){
let open=price;
let close=open+(Math.random()-.48)*5;
let high=Math.max(open,close)+Math.random()*2;
let low=Math.min(open,close)-Math.random()*2;
candles.push({open,close,high,low});
price=close;
}

let min=Math.min(...candles.map(c=>c.low));
let max=Math.max(...candles.map(c=>c.high));
let range=max-min||1;

function y(value){
return height-((value-min)/range)*(height-20)-10;
}

let gap=width/candles.length;
candles.forEach((c,i)=>{
let x=i*gap+gap/2;
let color=c.close>=c.open?"#21d889":"#ff5151";

ctx.strokeStyle=color;
ctx.fillStyle=color;
ctx.lineWidth=1.5;

ctx.beginPath();
ctx.moveTo(x,y(c.high));
ctx.lineTo(x,y(c.low));
ctx.stroke();

let top=Math.min(y(c.open),y(c.close));
let body=Math.max(2,Math.abs(y(c.open)-y(c.close)));

ctx.fillRect(x-gap*.3,top,gap*.6,body);
});
}

function analyze(){
document.getElementById("result").innerHTML=`
<div class="signal-icon neutral">◆</div>
<div class="signal-title neutral">EN ATTENTE</div>
<p>${document.getElementById("asset").value}</p>
<p>Aucune donnée réelle connectée.</p>
<p class="info">L'analyse automatique sera disponible après connexion aux données de marché et au moteur d'analyse.</p>
`;
}

drawChart();
window.addEventListener("resize",drawChart);
</script>

</body>
</html>

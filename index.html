<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOLD AI</title>
<style>
:root {
--bg:#080b12; --card:#111824; --gold:#e8bd59;
--green:#20d49a; --red:#ff6474; --text:#f4f6fa;
--muted:#8995a8; --border:#29364a;
}
* { box-sizing:border-box; }
body {
margin:0; padding:15px; background:var(--bg);
color:var(--text); font-family:Arial,sans-serif;
}
.app { max-width:850px; margin:auto; }
header {
display:flex; justify-content:space-between;
align-items:center; gap:10px; margin-bottom:20px;
flex-wrap:wrap;
}
.logo { font-size:28px; font-weight:900; }
.logo span { color:var(--gold); }
.badge {
font-size:11px; padding:8px 11px; border-radius:20px;
background:#302716; color:var(--gold);
}
.card {
background:var(--card); border:1px solid var(--border);
border-radius:17px; padding:18px; margin-bottom:15px;
}
label { color:var(--muted); font-size:11px; }
.price {
font-size:clamp(34px,9vw,52px);
font-weight:800; margin:18px 0;
}
.metrics {
display:grid; grid-template-columns:repeat(3,1fr);
gap:10px; margin-top:20px;
}
.metric {
background:#192333; padding:14px; border-radius:10px;
min-width:0;
}
.metric strong {
display:block; font-size:17px; margin-top:9px;
overflow-wrap:anywhere;
}
.muted { color:var(--muted); font-size:12px; line-height:1.6; }
.status { font-size:13px; margin-top:10px; }
button {
background:#302716; color:var(--gold);
border:1px solid #725b2b; border-radius:10px;
padding:12px 18px; cursor:pointer; margin-top:15px;
}
canvas { width:100%; height:220px; display:block; margin-top:15px; }
@media(max-width:550px) {
body { padding:10px; }
.metrics { grid-template-columns:1fr 1fr; }
}
</style>
</head>
<body>
<main class="app">
<header>
<div class="logo">GOLD <span>AI</span></div>
<div class="badge">RAISEFX · MT5 DÉMO</div>
</header>

<section class="card">
<label>ACTIF CONNECTÉ</label>
<h2>XAUUSD · GOLD</h2>

<div class="muted">DERNIER COURS REÇU</div>
<div class="price" id="price">--</div>
<div class="status" id="status">Connexion en cours...</div>

<div class="metrics">
<div class="metric">
<label>BID</label>
<strong id="bid">--</strong>
</div>
<div class="metric">
<label>ASK</label>
<strong id="ask">--</strong>
</div>
<div class="metric">
<label>SPREAD</label>
<strong id="spread">--</strong>
</div>
</div>

<p class="muted" id="time">Dernière réception : --</p>
<p class="muted">Source : ton MT5 RaiseFX</p>
<button id="refresh">↻ ACTUALISER</button>
</section>

<section class="card">
<strong>Évolution du cours reçu</strong>
<canvas id="chart"></canvas>
<p class="muted">Historique des cotations reçues depuis l'ouverture de cette page.</p>
</section>
</main>

<script>
const API = "/api/tick";
const $ = id => document.getElementById(id);
let prices = [];
let busy = false;

function number(value) {
return Number(value).toLocaleString("en-US", {
minimumFractionDigits:2,
maximumFractionDigits:2
});
}

function drawChart() {
const canvas = $("chart");
const width = canvas.clientWidth;
const height = canvas.clientHeight;
const ratio = window.devicePixelRatio || 1;

canvas.width = width * ratio;
canvas.height = height * ratio;

const ctx = canvas.getContext("2d");
ctx.setTransform(ratio,0,0,ratio,0,0);
ctx.clearRect(0,0,width,height);

if (prices.length < 2) return;

const min = Math.min(...prices);
const max = Math.max(...prices);
const range = max-min || 1;

ctx.strokeStyle = "#e8bd59";
ctx.lineWidth = 2;
ctx.beginPath();

prices.forEach((value,index) => {
const x = index/(prices.length-1)*width;
const y = height-10-((value-min)/range)*(height-20);
if (index === 0) ctx.moveTo(x,y);
else ctx.lineTo(x,y);
});

ctx.stroke();
}

async function loadTick() {
if (busy) return;
busy = true;

try {
const response = await fetch(API + "?t=" + Date.now(), {
cache:"no-store"
});

if (!response.ok) throw new Error("Erreur serveur " + response.status);

const data = await response.json();
const tick = data.tick;

if (!tick || !Number.isFinite(Number(tick.bid)) ||
!Number.isFinite(Number(tick.ask))) {
throw new Error("Aucune cotation reçue");
}

const bid = Number(tick.bid);
const ask = Number(tick.ask);
const mid = (bid+ask)/2;

$("price").textContent = number(mid);
$("bid").textContent = number(bid);
$("ask").textContent = number(ask);
$("spread").textContent = number(ask-bid);

const received = Number(tick.receivedAt);
const age = Number.isFinite(received)
? Math.max(0,Math.floor((Date.now()-received)/1000))
: null;

$("time").textContent = "Dernière réception : " +
(age === null ? "indisponible" : age + " seconde(s) auparavant");

if (age !== null && age <= 5) {
$("status").textContent = "● CONNECTÉ · PRIX MT5";
$("status").style.color = "var(--green)";
} else {
$("status").textContent = "● COTATION ANCIENNE";
$("status").style.color = "var(--red)";
}

prices.push(mid);
if (prices.length > 60) prices.shift();
drawChart();

} catch(error) {
$("status").textContent = "● " + error.message;
$("status").style.color = "var(--red)";
} finally {
busy = false;
}
}

$("refresh").addEventListener("click",loadTick);
window.addEventListener("resize",drawChart);

loadTick();
setInterval(loadTick,1000);
</script>
</body>
</html>
